<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beautiful Harmony</title>

<link rel="stylesheet" href="style.css?v=0.6.1">

</head>

<body>

<!-- 花びらレイヤー -->
<div id="petals"></div>

<div class="container">

    <!-- タイトル -->

    <section id="titleScreen">

        <h1>Beautiful Harmony</h1>

        <p class="copy">

            Create Balance.<br>
            Create Beauty.

        </p>

        <p class="subcopy">

            Every piece has its perfect place.

        </p>

        <button id="playButton">

            Play

        </button>

    </section>

    <!-- テーマ選択 -->

    <section id="themeScreen" class="hidden">

        <h2>Theme</h2>

        <div class="themeButtons">

            <button id="colorsButton">

                🎨 Colors

            </button>

            <button disabled>

                💐 Bouquet

            </button>

            <button disabled>

                👩 Girls

            </button>

            <button disabled>

                ⚔️ Generals

            </button>

        </div>

        <div class="bestBox">

            <p>Best Harmony</p>

            <h3>--%</h3>

        </div>

    </section>

    <!-- Colors -->

    <section id="colorsScreen" class="hidden">

        <div class="header">

            <h2>🎨 Colors</h2>

            <button id="backButton">

                ← Theme

            </button>

        </div>

        <!-- JavaScriptがここへ25枚生成 -->

        <div id="board"></div>

        <button id="finishButton">

            満足

        </button>

    </section>

    <!-- 結果画面（まだ仮） -->

    <section id="resultScreen" class="hidden">

        <h2>Harmony</h2>

        <h1 id="scoreText">

            92%

        </h1>

        <p>

            ※採点画面は次回実装

        </p>

        <button id="retryButton">

            Themeへ戻る

        </button>

    </section>

</div>

<script src="main.js?v=0.9.0"></script>

</body>

</html>
