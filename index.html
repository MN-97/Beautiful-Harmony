<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beautiful Harmony</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- タイトル画面 -->

    <section id="titleScreen">

        <h1>🌸 Beautiful Harmony 🌸</h1>

        <p class="copy">
            Create Balance.<br>
            Create Beauty.
        </p>

        <p class="subcopy">
            Every piece has its perfect place.
        </p>

        <button id="playButton">
            Play
        </button>

    </section>



    <!-- テーマ選択 -->

    <section id="themeScreen" class="hidden">

        <h2>Theme</h2>

        <button id="colorsButton">
            🎨 Colors
        </button>

        <button disabled>
            💐 Bouquet
        </button>

        <button disabled>
            👩 Girls
        </button>

        <button disabled>
            ⚔️ Generals
        </button>

        <div class="best">

            <p>Best Harmony</p>

            <h3>--%</h3>

        </div>

    </section>



    <!-- Colors画面 -->

    <section id="colorsScreen" class="hidden">

        <h2>🎨 Colors</h2>

        <div id="board">

            <!-- 25枚 -->

            <div class="tile">♥</div>
            <div class="tile">♦</div>
            <div class="tile">♠</div>
            <div class="tile">♣</div>
            <div class="tile">♥</div>

            <div class="tile">♦</div>
            <div class="tile">♠</div>
            <div class="tile">♣</div>
            <div class="tile">♥</div>
            <div class="tile">♦</div>

            <div class="tile">♠</div>
            <div class="tile">♣</div>
            <div class="tile">♥</div>
            <div class="tile">♦</div>
            <div class="tile">♠</div>

            <div class="tile">♣</div>
            <div class="tile">♥</div>
            <div class="tile">♦</div>
            <div class="tile">♠</div>
            <div class="tile">♣</div>

            <div class="tile">♥</div>
            <div class="tile">♦</div>
            <div class="tile">♠</div>
            <div class="tile">♣</div>
            <div class="tile">♥</div>

        </div>

        <button id="finishButton">

            満足

        </button>

    </section>

</div>

<script src="main.js"></script>

</body>

</html>
